[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dispatcher"
version = "0.1.0"
description = "Generic Codex Dispatcher (dry-run ticket extract + assess; no activation)."
readme = "README.md"
requires-python = ">=3.10"
# Zero runtime dependencies by design.
dependencies = []

[project.urls]
Homepage = "https://github.com/dexsword/codex-dispatcher"
Source = "https://github.com/dexsword/codex-dispatcher"

[project.scripts]
codex-dispatcher = "codex_dispatcher.worker.cli:main"

[tool.setuptools.packages.find]
include = ["codex_dispatcher*"]
